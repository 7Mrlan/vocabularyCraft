# Release APK 体积基线（字节）——**仅用于观察，不拦截构建**
#
# CI（.github/workflows/release.yml 的 Verify APK 步骤）会：
#   · 读这个数字，打印「当前体积 vs 基线」，超出只发一条 warning，不让构建失败；
#   · 另有一条**硬失败**检查：APK 只能含 arm64-v8a 一个 ABI。
#     多打一份 ABI 的原生库属于纯浪费（手机只加载自己那份），这种才必须拦住。
#
# 所以：加功能让包变大是正常的，需要时直接改这里的数字做记录即可；
# 但「同一份原生库多打了几份 ABI」是另一种问题，CI 会直接失败。
#
# 当前基线（v0.2.1）：arm64-v8a 单 ABI ≈ 38 MiB
#   · lib/arm64-v8a 原生库 ≈ 28 MiB（MapLibre 12.6 + ML Kit 翻译 15.6）
#   · dex ≈ 24 MiB（未开 R8 混淆）
#   · res/assets < 1 MiB
maxApkBytes=62914560
