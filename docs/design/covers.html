<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Wordloom 词书封面样机 v3</title>
<style>
  :root{ --paper:#efe9df; --ink:#1c1a17; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% 0%, #f6f2ea 0%, var(--paper) 60%, #e3dbcd 100%);
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;color:var(--ink);
  }
  .stage{display:flex;gap:56px;padding:70px 72px;perspective:1600px}
  .wrap{position:relative}
  .label{position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.18em;color:#7a7062}
  .cover{
    position:relative;width:310px;height:434px;border-radius:3px 9px 9px 3px;
    box-shadow:0 2px 1px rgba(0,0,0,.18),0 18px 30px -12px rgba(30,20,10,.45),0 44px 64px -32px rgba(30,20,10,.38);
    transform:rotateY(-6deg) rotateX(1.4deg);transform-style:preserve-3d;overflow:hidden;
  }
  .cloth{position:absolute;inset:0;pointer-events:none}
  .cloth::before{
    content:"";position:absolute;inset:0;opacity:.55;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 4px);
  }
  .cloth::after{
    content:"";position:absolute;inset:0;opacity:.15;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter>\
<rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .spine{
    position:absolute;left:0;top:0;bottom:0;width:15px;
    background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(0,0,0,.30) 55%,rgba(0,0,0,.10));
    box-shadow:inset -1px 0 0 rgba(255,255,255,.10),inset 1px 0 0 rgba(0,0,0,.25);
  }
  .spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:3px;
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.22))}
  .spine::before{top:62px}.spine::after{bottom:62px}
  .face{position:absolute;inset:0 0 0 15px}
  /* double blind rule */
  .frame{position:absolute;inset:14px;border:1px solid rgba(255,255,255,.085);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 -1px 0 rgba(0,0,0,.20);pointer-events:none}
  .frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.045)}
  .brand{position:absolute;left:30px;top:30px;font-size:9.5px;letter-spacing:.30em;color:rgba(255,255,255,.50)}
  .title{
    position:absolute;right:40px;top:34px;
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:41px;line-height:1.06;letter-spacing:.10em;font-weight:600;
    white-space:nowrap;
  }
  .ghost{
    position:absolute;left:34px;top:150px;
    font-size:150px;line-height:1;font-weight:600;
    color:rgba(255,255,255,.030);
    text-shadow:0 1px 0 rgba(0,0,0,.32),0 -1px 0 rgba(255,255,255,.05);
    pointer-events:none;user-select:none;
  }
  .subline{position:absolute;left:32px;bottom:96px;font-size:10.5px;letter-spacing:.26em;opacity:.62}
  .rule{position:absolute;left:32px;right:64px;bottom:80px;height:1px;opacity:.5}
  .bottom{position:absolute;left:32px;bottom:22px;right:70px}
  .count{font-size:33px;line-height:.9;letter-spacing:.02em}
  .count small{display:block;font-size:10px;letter-spacing:.22em;opacity:.68;margin-top:9px}
  .vol{position:absolute;right:30px;bottom:24px;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;
    border:1px solid currentColor;opacity:.78}
  .foil{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(116deg,transparent 42%,rgba(255,255,255,.05) 48%,rgba(255,255,255,.012) 54%,transparent 62%);
    mix-blend-mode:screen}

  .c1{background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.09),transparent 55%),
      linear-gradient(160deg,#344330 0%,#28361f 55%,#1e2817 100%)}
  .c1 .title,.c1 .count{color:#D9B36A;text-shadow:0 1px 0 rgba(0,0,0,.45),0 0 18px rgba(217,179,106,.10)}
  .c1 .subline,.c1 .brand{color:#EAD9B4}
  .c1 .rule{background:linear-gradient(90deg,#D9B36A,rgba(217,179,106,0))}
  .c1 .vol{color:#D9B36A}

  .c2{background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.075),transparent 55%),
      linear-gradient(160deg,#4d262c 0%,#3c1f25 55%,#2b161b 100%)}
  .c2 .title,.c2 .count{color:#E7C9A2;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 18px rgba(231,201,162,.10)}
  .c2 .title{font-size:38px;letter-spacing:.06em}
  .c2 .subline,.c2 .brand{color:#EAD3B6}
  .c2 .rule{background:linear-gradient(90deg,#E7C9A2,rgba(231,201,162,0))}
  .c2 .vol{color:#E7C9A2}

  .c3{background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.065),transparent 55%),
      linear-gradient(160deg,#2d2b26 0%,#23211d 55%,#191814 100%)}
  .c3 .title,.c3 .count{color:#D8D2C4;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 16px rgba(216,210,196,.08)}
  .c3 .subline,.c3 .brand{color:#CFC8B8}
  .c3 .rule{background:linear-gradient(90deg,#CFC8B8,rgba(207,200,184,0))}
  .c3 .vol{color:#CFC8B8}

  .caption{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:11px;letter-spacing:.22em;color:#8b8172}
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="label">通用核心 · 三千词族</div>
      <div class="cover c1">
        <div class="cloth"></div><div class="spine"></div>
        <div class="face">
          <div class="frame"></div>
          <div class="brand">Wordloom 词书</div>
          <div class="title">通用核心</div>
          <div class="ghost">通</div>
          <div class="subline">日常英语的底子</div>
          <div class="rule"></div>
          <div class="bottom"><div class="count">3000<small>词族 · 词频排序</small></div></div>
          <div class="vol">I</div>
          <div class="foil"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="label">四六级核心 · 两千五</div>
      <div class="cover c2">
        <div class="cloth"></div><div class="spine"></div>
        <div class="face">
          <div class="frame"></div>
          <div class="brand">Wordloom 词书</div>
          <div class="title">四六级核心</div>
          <div class="ghost">四</div>
          <div class="subline">大纲收词 · 按词频裁剪</div>
          <div class="rule"></div>
          <div class="bottom"><div class="count">2500<small>词族 · CET 4/6</small></div></div>
          <div class="vol">II</div>
          <div class="foil"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="label">考研核心 · 三千</div>
      <div class="cover c3">
        <div class="cloth"></div><div class="spine"></div>
        <div class="face">
          <div class="frame"></div>
          <div class="brand">Wordloom 词书</div>
          <div class="title">考研核心</div>
          <div class="ghost">考</div>
          <div class="subline">大纲收词 · 按词频裁剪</div>
          <div class="rule"></div>
          <div class="bottom"><div class="count">3000<small>词族 · 考研大纲</small></div></div>
          <div class="vol">III</div>
          <div class="foil"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">Wordloom 词书封面 · 方向样机 v3（非最终稿）</div>
</body>
</html>
