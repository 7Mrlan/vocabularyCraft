name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the APK to (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No local.properties on CI, so the build falls back to the debug signing
      # config (see app/build.gradle.kts). That produces an installable APK for
      # device verification; a store-signed build still needs the keystore.
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordloom-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: false
