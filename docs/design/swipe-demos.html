<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习卡 · 三种滑动动效</title>
<style>
  :root{
    --paper:#f6f3ec; --ink:#16223a; --muted:#7b8494; --line:#e6e0d4;
    --white:#ffffff; --coral:#c9502b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; padding:40px 24px 56px;
    background:radial-gradient(1100px 600px at 50% 0%,#fbf8f2 0%,#efe9de 70%,#e7dfd1 100%);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif; color:var(--ink);
    display:flex; justify-content:center;
  }
  .wrap{display:flex; gap:44px; align-items:flex-start; flex-wrap:wrap; justify-content:center}
  .col{width:340px}
  .col h2{margin:0 0 4px; font-size:14px; font-weight:600; letter-spacing:.02em}
  .col p{margin:0 0 16px; font-size:11px; line-height:17px; color:#7d7466}

  .phone{
    position:relative; height:600px; border-radius:34px;
    background:var(--paper); overflow:hidden;
    box-shadow:0 2px 2px rgba(0,0,0,.06), 0 30px 60px -34px rgba(30,20,10,.35);
  }
  .phone .bar{position:absolute; top:16px; left:22px; right:22px; display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:600}
  .phone .bar .back{font-size:15px; opacity:.75}
  .phone .bar .count{margin-left:auto; font-size:10.5px; font-weight:400; color:var(--muted)}

  .card{
    position:absolute; left:24px; right:24px; top:84px; height:460px;
    border-radius:24px; background:var(--white);
    box-shadow:0 6px 18px -10px rgba(30,20,10,.28);
    overflow:hidden; touch-action:none; cursor:grab; will-change:transform;
  }
  .card:active{cursor:grabbing}
  .page{
    position:absolute; inset:0; padding:24px 22px; will-change:transform;
    background:var(--white);
  }
  .page .word{font-family:Georgia,"Songti SC",serif; font-size:31px; font-weight:700; color:var(--ink)}
  .page .ipa{font-family:Georgia,serif; font-size:12.5px; color:var(--muted); margin-top:2px}
  .page .zh{margin-top:12px; font-size:12px; line-height:18px; color:#3c4a60}
  .page .blurb{margin-top:12px; font-family:Georgia,"Songti SC",serif; font-size:13.5px; line-height:20px; color:var(--ink)}
  .page .sense{margin-top:9px; display:flex; gap:8px; font-size:12.5px; line-height:18px}
  .page .pos{width:32px; flex:none; font-family:Georgia,serif; font-size:10px; color:var(--muted); padding-top:1px}
  .page .ex{margin-top:12px; font-family:Georgia,"Songti SC",serif; font-size:14px; line-height:21px}
  .page .ex .hl{color:var(--coral); font-weight:700}
  .page .exz{margin-top:4px; font-size:11.5px; color:var(--muted)}
  .page .dots{position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; gap:5px}
  .page .dots i{width:5px; height:5px; border-radius:50%; background:#d8d1c3; display:block}
  .page .dots i.on{background:var(--ink); width:14px; border-radius:3px}

  .hint{position:absolute; left:0; right:0; bottom:18px; text-align:center;
    font-size:10.5px; letter-spacing:.12em; color:#a79d8e; pointer-events:none}

  /* B 立体回转 */
  .card.tilt{transform-style:preserve-3d; perspective:1200px; background:transparent; box-shadow:none; overflow:visible}
  .tilt .sheet{
    position:absolute; inset:0; border-radius:24px; background:var(--white); overflow:hidden;
    box-shadow:0 10px 26px -12px rgba(30,20,10,.35);
    transform-style:preserve-3d; backface-visibility:hidden; will-change:transform;
  }
  .tilt .under{
    position:absolute; inset:0; border-radius:24px; background:var(--white); overflow:hidden;
    box-shadow:0 6px 16px -10px rgba(30,20,10,.3);
    will-change:transform; opacity:.9;
  }
  .tilt .sheet::after{
    content:""; position:absolute; top:0; bottom:0; right:0; width:5px;
    background:linear-gradient(90deg,rgba(30,20,10,.06),rgba(30,20,10,.16));
    border-radius:0 24px 24px 0;
  }

  /* C 叠页抛掷 */
  .stack{position:absolute; left:24px; right:24px; top:84px; height:460px; touch-action:none; cursor:grab}
  .stack .layer{
    position:absolute; inset:0; border-radius:24px; background:var(--white); overflow:hidden;
    box-shadow:0 8px 22px -12px rgba(30,20,10,.32);
    will-change:transform,opacity; transform-origin:50% 60%;
  }
  .stack .top{cursor:grab}
  .stack .top:active{cursor:grabbing}

  .variants{display:flex; gap:8px; margin-top:12px}
  .variants button{border:1px solid #d8d0c2; background:#fff; color:#5d5546; border-radius:99px;
    padding:6px 12px; font-size:11px; cursor:pointer}
  .variants button.on{background:var(--ink); border-color:var(--ink); color:#fff}
</style>
</head>
<body>
<div class="wrap">

  <section class="col">
    <h2>A · 跟手平移</h2>
    <p>卡框不动，内容跟手滑动，相邻页从对应一侧进入。方向最直接，也最容易做顺；缺点是整个页面像一块平板，少了点纸的厚度。</p>
    <div class="phone" data-mode="follow">
      <div class="bar"><span class="back">‹</span>背单词<span class="count">2/10</span></div>
      <div class="card" id="cardA"></div>
      <div class="hint">左右拖动试试 · 拖到底会绕回主卡</div>
    </div>
  </section>

  <section class="col">
    <h2>B · 立体回转</h2>
    <p>整张卡绕着纵轴转，像把手里的一张纸翻过去；下一张在它后面等着。转向本身就是方向感，停下来时纸回正。</p>
    <div class="phone" data-mode="tilt">
      <div class="bar"><span class="back">‹</span>背单词<span class="count">2/10</span></div>
      <div class="card tilt" id="cardB"></div>
      <div class="hint">左右拖动试试 · 拖到底会绕回主卡</div>
    </div>
  </section>

  <section class="col">
    <h2>C · 叠页抛掷</h2>
    <p>例句是一叠卡片：拖到一半就能看到下面那张，松手后当前页被"甩"走、下一张顶上来。力度和方向最明显，也最像游戏。</p>
    <div class="phone" data-mode="stack">
      <div class="bar"><span class="back">‹</span>背单词<span class="count">2/10</span></div>
      <div class="stack" id="cardC"></div>
      <div class="hint">左右拖动试试 · 甩走最后一张会露出主卡</div>
    </div>
  </section>

</div>

<script>
const PAGES = [
  {
    kind: "main", word: "make", ipa: "/meɪk/",
    zh: "v. 制造；使变得；整理（床铺）；成为；估计",
    blurb: "If you offer to sell me your car, I might ask you, “What make is it?” Then you tell me the brand, year and model it is.",
    senses: [["verb","perform or carry out"],["verb","carry out or commit"]],
    ex: "Never make your students feel ignorant.",
    exz: "千万别让你的学生感到自己一无所知。"
  },
  {
    kind: "ex", en: 'Never <span class="hl">make</span> your students feel ignorant.',
    zh: "千万别让你的学生感到自己一无所知。"
  },
  {
    kind: "ex", en: 'What <span class="hl">make</span> is your car?',
    zh: "你的车是什么牌子的？"
  },
  {
    kind: "ex", en: 'She <span class="hl">made</span> him a cup of tea.',
    zh: "她给他泡了一杯茶。"
  }
];
const N = PAGES.length;
const mod = n => ((n % N) + N) % N;
const wrap = d => d > N/2 ? d - N : d;
const W = () => document.querySelector('.phone')?.clientWidth || 340;
const CW = 292; // card width used in transforms

function pageHTML(i){
  const p = PAGES[i];
  const dots = `<div class="dots">${PAGES.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
  if (p.kind === "main") {
    return `<div class="page" style="position:relative">
      <div class="word">${p.word} <span style="font-size:13px;opacity:.35">🔈</span></div>
      <div class="ipa">${p.ipa}</div>
      <div class="zh">${p.zh}</div>
      <div class="blurb">${p.blurb}</div>
      ${p.senses.map(([pos,def])=>`<div class="sense"><span class="pos">${pos}</span><span>${def}</span></div>`).join('')}
      <div class="ex">${p.ex}</div>
      <div class="exz">${p.exz}</div>
      ${dots}
    </div>`;
  }
  return `<div class="page" style="position:relative">
      <div class="word" style="font-size:16px">make</div>
      <div class="ex" style="margin-top:22px;font-size:20px;line-height:29px">${p.en}</div>
      <div class="exz" style="font-size:12px;margin-top:10px">${p.zh}</div>
      ${dots}
    </div>`;
}

/* ---------- A: 跟手平移 ---------- */
(function(){
  const host = document.querySelector('[data-mode="follow"] .card');
  host.style.perspective = 'none';
  host.innerHTML = `<div class="a-slot cur" style="position:absolute;inset:0"></div>
                    <div class="a-slot nxt" style="position:absolute;inset:0;display:none"></div>`;
  const cur = host.querySelector('.cur'), nxt = host.querySelector('.nxt');
  let index = 0, dx = 0, dragging = false, startX = 0, lastX = 0, lastT = 0, vel = 0;
  const width = 292;
  function render(){
    cur.innerHTML = pageHTML(index);
    cur.style.transform = `translateX(${dx}px)`;
    if (dx === 0) { nxt.style.display = 'none'; return; }
    const dir = dx > 0 ? 1 : -1;           // right = forward
    const nb = mod(index + dir);
    nxt.style.display = 'block';
    nxt.innerHTML = pageHTML(nb);
    nxt.style.transform = `translateX(${dx - dir * width}px)`;
  }
  function settle(target, done){
    const t0 = performance.now(), from = dx, dur = 380;
    host.style.transition = 'none';
    function step(t){
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      dx = from + (target - from) * e;
      render();
      if (p < 1) requestAnimationFrame(step);
      else { dx = target; render(); done && done(); }
    }
    requestAnimationFrame(step);
  }
  function release(){
    const threshold = width * .18;
    if (Math.abs(dx) > threshold || Math.abs(vel) > .45) {
      const dir = dx > 0 ? 1 : -1;
      settle(dir * width, () => { index = mod(index + dir); dx = 0; render(); });
    } else {
      settle(0);
    }
  }
  host.addEventListener('pointerdown', e => {
    dragging = true; startX = lastX = e.clientX; lastT = performance.now(); vel = 0;
    host.setPointerCapture(e.pointerId);
  });
  host.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now();
    vel = (e.clientX - lastX) / Math.max(1, now - lastT) * 16 / width;
    lastT = now; lastX = e.clientX;
    dx = Math.max(-width, Math.min(width, dx + (e.clientX - startX) - (dx)));
    // simpler: dx tracks finger from start
    dx = Math.max(-width, Math.min(width, e.clientX - startX));
    render();
  });
  host.addEventListener('pointerup', () => { dragging = false; release(); });
  host.addEventListener('pointercancel', () => { dragging = false; settle(0); });
  render();
})();

/* ---------- B: 立体回转 ---------- */
(function(){
  const host = document.querySelector('[data-mode="tilt"] .card');
  host.innerHTML = `<div class="under"></div><div class="sheet"></div>`;
  const sheet = host.querySelector('.sheet'), under = host.querySelector('.under');
  let index = 0, dx = 0, dragging = false, startX = 0, lastX = 0, lastT = 0, vel = 0;
  const width = 292;
  function render(){
    sheet.innerHTML = pageHTML(index);
    const p = dx / width;
    sheet.style.transform = `translateX(${dx * .30}px) rotateY(${-p * 20}deg)`;
    if (dx === 0) { under.style.opacity = '0'; return; }
    const dir = dx > 0 ? 1 : -1;
    under.innerHTML = pageHTML(mod(index + dir));
    under.style.opacity = String(Math.min(1, Math.abs(p) * 1.6));
    under.style.transform = `translateX(${dx * .55 - dir * width * .38}px) scale(.965)`;
  }
  function settle(target, done){
    const t0 = performance.now(), from = dx, dur = 420;
    function step(t){
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      dx = from + (target - from) * e;
      render();
      if (p < 1) requestAnimationFrame(step);
      else done && done();
    }
    requestAnimationFrame(step);
  }
  function release(){
    const threshold = width * .18;
    if (Math.abs(dx) > threshold || Math.abs(vel) > .45) {
      const dir = dx > 0 ? 1 : -1;
      settle(dir * width, () => { index = mod(index + dir); dx = 0; render(); });
    } else settle(0);
  }
  host.addEventListener('pointerdown', e => {
    dragging = true; startX = lastX = e.clientX; lastT = performance.now(); vel = 0;
    host.setPointerCapture(e.pointerId);
  });
  host.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now();
    vel = (e.clientX - lastX) / Math.max(1, now - lastT) * 16 / width;
    lastT = now; lastX = e.clientX;
    dx = Math.max(-width, Math.min(width, e.clientX - startX));
    render();
  });
  host.addEventListener('pointerup', () => { dragging = false; release(); });
  host.addEventListener('pointercancel', () => { dragging = false; settle(0); });
  render();
})();

/* ---------- C: 叠页抛掷 ---------- */
(function(){
  const host = document.querySelector('[data-mode="stack"] .stack');
  host.innerHTML = `<div class="layer back2"></div><div class="layer back1"></div><div class="layer top"></div>`;
  const back2 = host.querySelector('.back2'), back1 = host.querySelector('.back1'), top = host.querySelector('.top');
  let index = 0, dx = 0, dragging = false, startX = 0, lastX = 0, lastT = 0, vel = 0;
  const width = 292;
  function renderStack(){
    top.innerHTML = pageHTML(index);
    back1.innerHTML = pageHTML(mod(index + 1));
    back2.innerHTML = pageHTML(mod(index + 2));
    back1.style.transform = 'translateY(9px) scale(.965)';
    back2.style.transform = 'translateY(18px) scale(.93)';
    back1.style.opacity = '1'; back2.style.opacity = '1';
  }
  function renderDrag(){
    if (dx === 0) { renderStack(); return; }
    top.innerHTML = pageHTML(index);
    back1.innerHTML = pageHTML(mod(index + 1));
    const p = dx / width;
    top.style.transform = `translateX(${dx}px) rotate(${p * 4}deg)`;
    top.style.boxShadow = `0 ${14 + Math.abs(p)*18}px ${26 + Math.abs(p)*18}px -12px rgba(30,20,10,.34)`;
    back1.style.transform = `translateY(${9 - Math.abs(p)*9}px) scale(${.965 + Math.abs(p)*.035})`;
  }
  function throwOut(dir, done){
    const t0 = performance.now(), from = dx, dur = 300;
    const target = dir * width * 1.25;
    function step(t){
      const p = Math.min(1, (t - t0) / dur);
      const e = p * p;
      dx = from + (target - from) * e;
      const rot = dx / width * 4;
      top.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
      top.style.opacity = String(1 - p * .55);
      if (p < 1) requestAnimationFrame(step);
      else { done && done(); }
    }
    requestAnimationFrame(step);
  }
  function settleBack(){
    const t0 = performance.now(), from = dx, dur = 300;
    function step(t){
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      dx = from * (1 - e);
      if (dx !== 0) renderDrag(); else renderStack();
      if (p < 1) requestAnimationFrame(step);
      else { dx = 0; top.style.transform = ''; top.style.opacity = '1'; top.style.boxShadow = ''; renderStack(); }
    }
    requestAnimationFrame(step);
  }
  function release(){
    const threshold = width * .18;
    if (Math.abs(dx) > threshold || Math.abs(vel) > .45) {
      const dir = dx > 0 ? 1 : -1;
      throwOut(dir, () => {
        index = mod(index + dir); dx = 0;
        top.style.transition = 'none'; top.style.transform = 'scale(.94)'; top.style.opacity = '1';
        renderStack();
        requestAnimationFrame(() => {
          top.style.transition = 'transform .26s cubic-bezier(.22,.8,.2,1)';
          top.style.transform = '';
        });
      });
    } else settleBack();
  }
  host.addEventListener('pointerdown', e => {
    dragging = true; startX = lastX = e.clientX; lastT = performance.now(); vel = 0;
    host.setPointerCapture(e.pointerId);
    top.style.transition = 'none';
  });
  host.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now();
    vel = (e.clientX - lastX) / Math.max(1, now - lastT) * 16 / width;
    lastT = now; lastX = e.clientX;
    dx = Math.max(-width, Math.min(width, e.clientX - startX));
    renderDrag();
  });
  host.addEventListener('pointerup', () => { dragging = false; release(); });
  host.addEventListener('pointercancel', () => { dragging = false; settleBack(); });
  renderStack();
})();
</script>
</body>
</html>
