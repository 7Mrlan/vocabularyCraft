<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Wordloom 词书封面 v5 · 插画</title>
<style>
  :root{--paper:#efe9df;--ink:#1c1a17}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 620px at 50% 0%,#f7f3eb 0%,var(--paper) 62%,#e4dccd 100%);
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;color:var(--ink)}
  .stage{display:flex;gap:44px;padding:72px 64px;perspective:1500px;align-items:flex-end}
  .wrap{position:relative}
  .label{position:absolute;top:-28px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.16em;color:#7a7062}

  .cover{
    position:relative;width:286px;height:402px;border-radius:9px;
    transform:rotateY(-6deg) rotateX(1.2deg);transform-style:preserve-3d;
    box-shadow:0 2px 1px rgba(0,0,0,.16),0 16px 26px -12px rgba(40,25,15,.42),0 40px 56px -30px rgba(40,25,15,.34);
    overflow:hidden;
  }
  .cover.lift{transform:rotateY(-3deg) rotateX(1.2deg) scale(1.018);
    box-shadow:0 3px 1px rgba(0,0,0,.18),0 26px 38px -14px rgba(40,25,15,.5),0 56px 72px -34px rgba(40,25,15,.4)}
  .spine{position:absolute;left:0;top:0;bottom:0;width:12px;
    background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(0,0,0,.22) 60%,rgba(0,0,0,.06));
    box-shadow:inset -1px 0 0 rgba(255,255,255,.12)}
  .spine::before{content:"";position:absolute;left:0;right:0;top:54px;height:2px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.18))}
  .face{position:absolute;inset:0 0 0 12px;overflow:hidden}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/></filter>\
<rect width='150' height='150' filter='url(%23n)' opacity='.6'/></svg>")}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 42%,rgba(0,0,0,.10))}
  .edge{position:absolute;inset:0;pointer-events:none;border-radius:9px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.18)}

  .head{position:absolute;left:26px;top:24px;right:64px}
  .kicker{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.72)}
  .title{margin-top:10px;font-size:25px;line-height:1.12;font-weight:600;color:var(--cream)}
  .sub{margin-top:9px;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.72)}
  .pill{position:absolute;right:18px;top:22px;padding:4px 9px;border-radius:99px;
    background:rgba(255,255,255,.22);color:#fff;font-size:10px;letter-spacing:.14em;backdrop-filter:blur(2px)}
  .foot{position:absolute;left:26px;bottom:22px;right:26px}
  .rule{height:1px;background:rgba(255,255,255,.32);margin-bottom:14px}
  .count{font-size:23px;color:var(--cream);letter-spacing:.02em}
  .count small{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.68);margin-left:8px}
  .art{position:absolute;right:-26px;bottom:44px;width:230px;height:230px;opacity:.98}

  /* palette */
  .c1{--cream:#F7EFDF;background:linear-gradient(165deg,#35A98F 0%,#2C9380 52%,#207566 100%)}
  .c2{--cream:#FBEFDD;background:linear-gradient(165deg,#EA7248 0%,#DA5F37 52%,#BC4A29 100%)}
  .c3{--cream:#F3ECDF;background:linear-gradient(165deg,#6663D6 0%,#5552C2 52%,#403EA1 100%)}
  .c4{--cream:#FBEEE2;background:linear-gradient(165deg,#DE6357 0%,#CE4F45 52%,#AE3B34 100%)}

  .caption{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:11px;letter-spacing:.2em;color:#8b8172}
</style>
</head>
<body>
  <div class="stage">

    <!-- 通用核心 -->
    <div class="wrap">
      <div class="label">通用核心 · 三千词族</div>
      <div class="cover c1 lift">
        <div class="spine"></div>
        <div class="face">
          <svg class="art" viewBox="0 0 230 230" fill="none">
            <circle cx="118" cy="112" r="64" fill="#0E3B33" opacity=".22"/>
            <path d="M150 12 L171 82 L241 103 L171 124 L150 194 L129 124 L59 103 L129 82 Z" fill="#F7EFDF"/>
            <path d="M96 52 L106 84 L138 94 L106 104 L96 136 L86 104 L54 94 L86 84 Z" fill="#0E3B33" opacity=".45"/>
            <circle cx="52" cy="168" r="7" fill="#F7EFDF" opacity=".8"/>
            <circle cx="196" cy="176" r="4.5" fill="#F7EFDF" opacity=".55"/>
          </svg>
          <div class="head">
            <div class="kicker">词书 · 第一卷</div>
            <div class="title">通用<br>核心</div>
            <div class="sub">日常英语的底子</div>
          </div>
          <div class="pill">在读</div>
          <div class="foot">
            <div class="rule"></div>
            <div class="count">3000<small>词族 · 词频排序</small></div>
          </div>
          <div class="grain"></div><div class="shade"></div><div class="edge"></div>
        </div>
      </div>
    </div>

    <!-- 四六级核心 -->
    <div class="wrap">
      <div class="label">四六级核心 · 两千五</div>
      <div class="cover c2">
        <div class="spine"></div>
        <div class="face">
          <svg class="art" viewBox="0 0 230 230" fill="none">
            <path d="M24 176 L96 104 L158 166 Z" fill="#5A1E12" opacity=".25"/>
            <path d="M52 132 L118 66 L184 132 L166 150 L118 102 L70 150 Z" fill="#FBEFDD"/>
            <path d="M78 96 L132 42 L186 96 L170 112 L132 74 L94 112 Z" fill="#FBEFDD" opacity=".82"/>
            <path d="M100 60 L140 20 L180 60 L166 74 L140 48 L114 74 Z" fill="#FBEFDD" opacity=".6"/>
          </svg>
          <div class="head">
            <div class="kicker">词书 · 第二卷</div>
            <div class="title">四六级<br>核心</div>
            <div class="sub">大纲收词 · 按词频裁剪</div>
          </div>
          <div class="foot">
            <div class="rule"></div>
            <div class="count">2500<small>词族 · CET 4/6</small></div>
          </div>
          <div class="grain"></div><div class="shade"></div><div class="edge"></div>
        </div>
      </div>
    </div>

    <!-- 考研核心 -->
    <div class="wrap">
      <div class="label">考研核心 · 三千</div>
      <div class="cover c3">
        <div class="spine"></div>
        <div class="face">
          <svg class="art" viewBox="0 0 230 230" fill="none">
            <circle cx="150" cy="92" r="58" fill="#F3ECDF" opacity=".18"/>
            <path d="M150 52 A44 44 0 1 0 150 140 A44 44 0 1 1 150 52 Z" fill="#F3ECDF" opacity=".85"/>
            <path d="M18 190 L92 84 L128 136 L152 104 L212 190 Z" fill="#F3ECDF"/>
            <path d="M92 84 L108 106 L84 106 Z" fill="#403EA1" opacity=".35"/>
          </svg>
          <div class="head">
            <div class="kicker">词书 · 第三卷</div>
            <div class="title">考研<br>核心</div>
            <div class="sub">大纲收词 · 按词频裁剪</div>
          </div>
          <div class="foot">
            <div class="rule"></div>
            <div class="count">3000<small>词族 · 考研大纲</small></div>
          </div>
          <div class="grain"></div><div class="shade"></div><div class="edge"></div>
        </div>
      </div>
    </div>

    <!-- 生词本 -->
    <div class="wrap">
      <div class="label">生词本 · 自动成书</div>
      <div class="cover c4">
        <div class="spine"></div>
        <div class="face">
          <svg class="art" viewBox="0 0 230 230" fill="none">
            <path d="M112 196 L112 96" stroke="#FBEEE2" stroke-width="10" stroke-linecap="round"/>
            <path d="M112 118 C112 78 84 52 40 46 C36 92 66 118 112 118 Z" fill="#FBEEE2"/>
            <path d="M114 150 C114 116 140 94 182 90 C184 128 158 150 114 150 Z" fill="#FBEEE2" opacity=".8"/>
            <circle cx="112" cy="196" r="16" fill="#4F1714" opacity=".28"/>
          </svg>
          <div class="head">
            <div class="kicker">词书 · 自建</div>
            <div class="title">生词本</div>
            <div class="sub">查过的词，长成一本书</div>
          </div>
          <div class="foot">
            <div class="rule"></div>
            <div class="count">动态<small>词族 · 自动收录</small></div>
          </div>
          <div class="grain"></div><div class="shade"></div><div class="edge"></div>
        </div>
      </div>
    </div>

  </div>
  <div class="caption">Wordloom 词书封面 · 插画方向 v5（参考你给的风格，非最终稿）</div>
</body>
</html>
