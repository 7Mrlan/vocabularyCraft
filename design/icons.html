<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Wordloom icon set v2</title>
<style>
  :root {
    --paper: #FFFFFF;
    --paper-dark: #0B1320;
    --page: #EEF2F7;
    --ink: #162941;
    --fill: #DCEAF9;
    --fill2: #A9CCEF;
    --accent: #F06989;
    --muted: #6B7C93;
  }
  .dark {
    --ink: #D6E6EB;
    --fill: #1B3350;
    --fill2: #2C5B8C;
    --accent: #FFA18C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--page);
    color: #162941;
    padding: 26px;
  }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 12px; color: var(--muted); }
  .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1040px; }
  .panel { border-radius: 18px; padding: 18px; background: var(--paper); }
  .panel.dark { background: var(--paper-dark); }
  .panel.dark h2 { color: #7D8EA6; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  figcaption { font-size: 10px; color: var(--muted); }
  .dark figcaption { color: #7D8EA6; }
  svg { display: block; }
</style>
</head>
<body>
<div class="sheet">
  <section class="panel light">
    <h2>Wordloom icons v2 · light</h2>
    <div class="row" id="lightRow"></div>
  </section>
  <section class="panel dark">
    <h2>dark</h2>
    <div class="row" id="darkRow"></div>
  </section>
</div>

<template id="set">
  <!-- sword: back -->
  <svg viewBox="0 0 24 24">
    <path d="M2 12 4.9 8.4 15.2 8.7v6.6L4.9 15.6Z" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M5.4 12h9" stroke="var(--fill)" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
    <path d="M15.7 6.9h1.4v10.2h-1.4Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M17.1 10.1h3.3v3.8h-3.3Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.1"/>
    <path d="M17.7 10.7l2.1 2.2M17.7 13.3l2.1-2.2" stroke="var(--ink)" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
    <circle cx="21.6" cy="12" r="1.9" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/>
  </svg>

  <!-- search -->
  <svg viewBox="0 0 24 24">
    <circle cx="10.2" cy="10.2" r="5.5" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M7.1 9.4c.5-1.5 1.7-2.4 3.1-2.4" stroke="var(--fill2)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M14.3 14.3 20 20" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="1.5" fill="var(--accent)"/>
  </svg>

  <!-- bookmark -->
  <svg viewBox="0 0 24 24">
    <path d="M7.2 4.4h9.6a1.2 1.2 0 0 1 1.2 1.2v14.6c0 .8-.9 1.3-1.6.8L12 18l-4.4 3c-.7.5-1.6 0-1.6-.8V5.6a1.2 1.2 0 0 1 1.2-1.2Z"
          fill="var(--fill)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 6.2v3.1" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <!-- bookmark active -->
  <svg viewBox="0 0 24 24">
    <path d="M7.2 4.4h9.6a1.2 1.2 0 0 1 1.2 1.2v14.6c0 .8-.9 1.3-1.6.8L12 18l-4.4 3c-.7.5-1.6 0-1.6-.8V5.6a1.2 1.2 0 0 1 1.2-1.2Z"
          fill="#005AFB" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M12 6.2v3.1" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
  </svg>

  <!-- refresh -->
  <svg viewBox="0 0 24 24">
    <path d="M19.4 12A7.4 7.4 0 1 1 15.7 5.6" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12.8 3.6 16.3 5.7 14 8.8" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="19.4" cy="12" r="1.4" fill="var(--accent)"/>
  </svg>

  <!-- volume -->
  <svg viewBox="0 0 24 24">
    <path d="M4 9.3h3.1l4.4-3.3v12l-4.4-3.3H4Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M14.6 9.4c1.2 1.4 1.2 3.2 0 4.6" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M17.2 7.3c2 2.3 2 6.4 0 8.7" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
  </svg>

  <!-- list -->
  <svg viewBox="0 0 24 24">
    <rect x="4" y="4.6" width="16" height="4.6" rx="1.6" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="4" y="9.6" width="16" height="9.8" rx="2" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.4"/>
    <path d="M7 12.6h9.2M7 15.2h6" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
    <circle cx="17.2" cy="16.6" r="1.2" fill="var(--accent)"/>
  </svg>

  <!-- pin -->
  <svg viewBox="0 0 24 24">
    <path d="M12 21s7-6.2 7-11.4a7 7 0 1 0-14 0C5 14.8 12 21 12 21Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="9.5" r="2.4" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.1"/>
    <circle cx="12" cy="9.5" r="1" fill="var(--accent)"/>
  </svg>

  <!-- forward (tintable) -->
  <svg viewBox="0 0 24 24">
    <path d="M3.6 11.6c3.6 1 7.2-.2 11.6.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M11.2 7.4 16 12l-4.8 4.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="3.8" cy="11.6" r="1.6" fill="currentColor"/>
  </svg>

  <!-- chevron -->
  <svg viewBox="0 0 24 24">
    <path d="M9.4 6.4c2.4 2 4.6 4 5.8 5.6-1.2 1.6-3.4 3.6-5.8 5.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- close -->
  <svg viewBox="0 0 24 24">
    <path d="M6.4 6.4C9 8.8 15.2 15.2 17.6 17.6M17.6 6.4C15 8.8 8.8 15.2 6.4 17.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="1.2" fill="var(--accent)"/>
  </svg>

  <!-- book -->
  <svg viewBox="0 0 24 24">
    <path d="M4.4 6.4C7.2 5.1 9.9 5.3 12 6.6v11.8c-2.1-1.3-4.8-1.5-7.6-.2Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M19.6 6.4c-2.8-1.3-5.5-1.1-7.6.2v11.8c2.1-1.3 4.8-1.5 7.6-.2Z" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M12 6.6v11.8" stroke="var(--ink)" stroke-width="1.2"/>
    <path d="M15.6 6.9v4.6l1.2-.9 1.2.9V6.9Z" fill="var(--accent)" stroke="var(--ink)" stroke-width=".9" stroke-linejoin="round"/>
  </svg>

  <!-- spark -->
  <svg viewBox="0 0 24 24">
    <path d="M12 3.9c.7 4.4 3.7 7.4 8.1 8.1-4.4.7-7.4 3.7-8.1 8.1-.7-4.4-3.7-7.4-8.1-8.1 4.4-.7 7.4-3.7 8.1-8.1Z"
          fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="1.4" fill="var(--accent)"/>
  </svg>
</template>

<div class="panel light" style="margin-top:18px;max-width:1040px">
  <h2>back candidates · at 44 / 24 / 20 / 16</h2>
  <div class="row" id="candRow"></div>
</div>
<template id="cands">
  <!-- diagonal sword -->
  <svg viewBox="0 0 24 24">
    <path d="M3.4 3.4 14.9 12.9 12.9 14.9 3.4 3.4Z" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M5.6 5.6 13.2 13.2" stroke="var(--fill)" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <path d="M11.6 16.8 16.8 11.6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 15 19.4 19.4" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="20.4" cy="20.4" r="1.9" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/>
  </svg>
  <!-- thread arrow -->
  <svg viewBox="0 0 24 24">
    <path d="M20.4 12.2C16.4 11 12.4 12.6 8.4 12" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8.4 12 13 7.4v9.2Z" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="20.4" cy="12.2" r="1.7" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/>
  </svg>
  <!-- dagger, fatter horizontal -->
  <svg viewBox="0 0 24 24">
    <path d="M2.4 12 5.4 6.6h9.4v10.8H5.4Z" fill="var(--fill2)" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M6.2 12h8.2" stroke="var(--fill)" stroke-width="1" stroke-linecap="round"/>
    <path d="M14.8 6.2h1.7v11.6h-1.7Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.1"/>
    <path d="M16.5 9.6h3.8v4.8h-3.8Z" fill="var(--fill)" stroke="var(--ink)" stroke-width="1.1"/>
    <circle cx="21.2" cy="12" r="1.9" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/>
  </svg>
</template>

<script>
  const names = ["back · sword","search","bookmark","bookmark on","refresh","volume","list","pin","forward","chevron","close","book","spark"];
  const cands = [...document.getElementById("cands").content.querySelectorAll("svg")].map(s => s.outerHTML);
  const candNames = ["sword diag","thread arrow","dagger"];
  const candRow = document.getElementById("candRow");
  cands.forEach((svg, i) => {
    for (const size of [44, 24, 20, 16]) {
      const fig = document.createElement("figure");
      fig.className = "light";
      fig.innerHTML = svg.replace('<svg ', `<svg width="${size}" height="${size}" `) +
        `<figcaption>${candNames[i]} ${size}</figcaption>`;
      candRow.appendChild(fig);
    }
  });
  const svgs = [...document.getElementById("set").content.querySelectorAll("svg")].map(s => s.outerHTML);
  for (const [rowId, cls] of [["lightRow","light"],["darkRow","dark"]]) {
    const row = document.getElementById(rowId);
    svgs.forEach((svg, i) => {
      for (const size of [44, 24, 18]) {
        const fig = document.createElement("figure");
        fig.className = cls;
        fig.innerHTML = svg.replace('<svg ', `<svg width="${size}" height="${size}" `) +
          `<figcaption>${names[i]}${size === 24 ? "" : " " + size}</figcaption>`;
        row.appendChild(fig);
      }
    });
  }
</script>
</body>
</html>
