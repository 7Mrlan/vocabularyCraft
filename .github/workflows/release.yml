name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the APK to (e.g. v0.2.1)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No local.properties on CI, so the build falls back to the debug signing
      # config (see app/build.gradle.kts). That produces an installable APK for
      # device verification; a store-signed build still needs the keystore.
      # The release variant ships arm64-v8a only, so the APK stays around 50 MiB
      # instead of carrying four ABIs' worth of native code.
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Mechanical guard against the APK silently growing back. MapLibre and ML Kit
      # ship native code per ABI, so re-adding x86 / x86_64 / armeabi-v7a would
      # take the package from ~38 MiB back to ~117 MiB for code no phone loads.
      # Docs (AGENTS.md, docs/BUILD.md) say "don't"; this step makes sure the
      # build actually fails if someone does it anyway.
      - name: Verify APK (ABI and size budget)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/
          test -s "$APK"

          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          ABIS=$("$AAPT2" dump badging "$APK" | grep "native-code:" || true)
          echo "ABIs: $ABIS"
          if [ -z "$ABIS" ]; then
            echo "::error::no native-code reported; the APK layout changed, check the ABI filter"
            exit 1
          fi
          if ! echo "$ABIS" | grep -q "native-code: 'arm64-v8a'"; then
            echo "::error::release APK must contain arm64-v8a (see docs/BUILD.md section 2)"
            exit 1
          fi
          if echo "$ABIS" | grep -qE "native-code:.*(x86|armeabi-v7a)"; then
            echo "::error::release APK must not bundle extra ABIs; that is what made it 117 MiB"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 62914560 ]; then
            echo "::error::APK is $((SIZE / 1048576)) MiB, over the 60 MiB budget (see docs/BUILD.md section 3)"
            exit 1
          fi

          "$AAPT2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordloom-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: false
